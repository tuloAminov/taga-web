name: Build and Deploy to Beget

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Deploy to Beget via FTPS
        env:
          FTP_HOST: t92401ab.beget.tech
          FTP_USER: t92401ab_taga
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: node deploy.js
